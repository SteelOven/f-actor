[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full-duplex"
version = "0.1.0"
requires-python = ">=3.10"

# Core dependencies: enough to run inference (dialogue generation + codec
# decoding) on CUDA, Apple Silicon (MPS), or CPU.
dependencies = [
    "transformers==4.53.3",
    "torch==2.8.0",
    "dataset==2.0.0",
    "wandb==0.22.2",
    "sentencepiece=0.2.1",
    "accelerate==1.10.1",
    "deepspeed==0.18.0",
    "pre-commit==4.3.0",
    "evaluate==0.4.6",
    "rouge_score==0.1.2",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "matplotlib==3.10.7",
    "hydra-core==1.3.2",
    "nemo-toolkit[tts]==2.5.2",
    "tqdm==4.67.1",
    "silero-vad==6.2.0",
    "jiwer==3.1.0",
    "torchcodec==0.8.0",
]

[project.optional-dependencies]
# Training / data preprocessing (Linux + CUDA assumed)
train = [
    "deepspeed; sys_platform == 'linux'",
    "wandb",
    "torchcodec",
    "librosa",
    "pre-commit",
]
# Dataset analysis tools (scripts/analysis/)
analysis = [
    "duckdb",
    "marimo",
    "pandas",
    "altair",
]
# Paper evaluation metrics (eval/ scripts; some still assume CUDA)
eval = [
    "jiwer",
    "silero-vad",
    "matplotlib",
    "hydra-core",
]

# On Linux, install CPU-only torch (the default PyPI wheel bundles ~3 GB of
# CUDA libraries). For Linux + NVIDIA GPU, install with the pip path described
# in LOCAL_SETUP.md instead of `uv sync`. macOS keeps the PyPI wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "build", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "build", "dist*", "playground*", "scripts*", "tests*"]

[tool.black]
line-length = 88

[tool.isort]
line_length = 88
profile = "black"
